<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic in Hanoi</title><link data-trunk rel="rust"><style>
:root{--page:#edf2ed;--ink:#16251a;--muted:#58685d;--line:#91a596;--board:#5b9369;--idle:#467955;--moving:#2f5d3c;--card:#fffdf7;--card-line:#5a675c;--accent:#f4d36b;--nest:6px;--card-radius:9px;--square-radius:15px;--board-radius:21px}*{box-sizing:border-box}body{background:var(--page);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;margin:0}main{margin:0 auto;max-width:74rem;min-height:100vh;padding:clamp(1rem,3vw,2.5rem)}h1{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:700;letter-spacing:-.04em;margin:0 0 .25rem}p{line-height:1.45}.panel{background:#f9fcf9;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #193b2212;margin:1rem 0;padding:1rem}.connection{align-items:center;display:flex;flex-wrap:wrap;gap:.45rem}input,button{border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;min-height:2.4rem;padding:.4rem .65rem}input{background:#fff;min-width:9rem}button{background:#f7faf7;cursor:pointer}button:hover:not(:disabled){background:#e3eee4}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,.board-square:focus-visible{outline:3px solid #f0bd2f;outline-offset:3px}.notice{color:var(--muted);min-height:1.5rem}.notice.error{color:#8c2431;font-weight:600}.game-layout{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr) minmax(13rem,18rem)}.game-meta{align-self:start}.game-meta h2{font-size:1rem;margin:0 0 .7rem}.game-meta dl{display:grid;gap:.45rem;margin:0}.game-meta dt{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}.game-meta dd{margin:-.35rem 0 0}.board-wrap{min-width:0;overflow:visible;position:relative}.board{background:var(--board);border:1px solid #396345;border-radius:var(--board-radius);display:grid;gap:var(--nest);grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));margin:var(--nest);min-height:min(68vw,38rem);overflow:visible;padding:var(--nest);position:relative}.board-square{appearance:none;background:var(--idle);border:1px solid #31583d;border-radius:var(--square-radius);color:#fff;cursor:pointer;min-height:0;overflow:visible;padding:0;position:relative;text-align:left}.board-square.moving{background:var(--moving);border-color:#1f452b}.board-square.evicted::after{background:var(--accent);border-radius:999px;color:#3d310d;content:"Evicted";font-size:.65rem;font-weight:700;left:.45rem;padding:.15rem .35rem;position:absolute;top:.45rem;z-index:30}.board-square.selected{box-shadow:inset 0 0 0 3px #9ce8bf,0 0 0 2px #d8ffea}.board-square.target{box-shadow:inset 0 0 0 3px #f6d76d}.square-label{bottom:.32rem;color:#d8ebdc;font-size:.63rem;left:.45rem;position:absolute;z-index:25}.pile{height:100%;min-height:0;overflow:visible;position:relative;width:100%}.playing-card{align-items:flex-start;background:var(--card);border:1px solid var(--card-line);border-radius:var(--card-radius);box-shadow:1px 2px 3px #102b1860;color:#172219;display:flex;font-family:Georgia,serif;font-size:clamp(.68rem,1.55vw,1rem);font-weight:700;height:82%;justify-content:flex-end;padding:.25em .32em;position:absolute;top:9%;width:58%}.playing-card .inverted{bottom:.25em;left:.32em;position:absolute;transform:rotate(180deg)}.playing-card.heart{color:#a32538}.playing-card.spade{color:#18241b}.pile.fanned{z-index:50}.pile.fanned .playing-card{box-shadow:3px 5px 9px #102b1866}.pile-summary{clip:rect(0 0 0 0);clip-path:inset(50%);height:1px;overflow:hidden;position:absolute;white-space:nowrap;width:1px}.controls{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1rem}.reviewing{background:#fff2c6;border:1px solid #d0ae4e;border-radius:9px;color:#5e4813;margin:.8rem 0 0;padding:.5rem .65rem}@media(max-width:680px){main{padding:1rem}.game-layout{grid-template-columns:1fr}.game-meta{order:-1}.board{min-height:82vw}}
</style></head><body></body></html>
