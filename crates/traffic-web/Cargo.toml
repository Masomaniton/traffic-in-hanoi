[package]
name = "traffic-web"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = "0.6"
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = "1.0"
traffic-core = { path = "../traffic-core" }
traffic-network = { path = "../traffic-network" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "HtmlInputElement", "Location", "MessageEvent", "WebSocket", "Window"] }
